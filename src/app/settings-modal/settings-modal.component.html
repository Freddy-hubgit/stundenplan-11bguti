<div class="modal-backdrop" *ngIf="open" (click)="onBackdropClick()">
  <div role="dialog" aria-modal="true" aria-label="Einstellungen" class="modal modal-wide" (click)="$event.stopPropagation()">
    <h2>Einstellungen</h2>

    <div class="settings-layout">
      <div class="settings-nav">
        <button type="button" class="settings-nav-btn" [class.active]="settingsCategory === 'darstellung'" [attr.aria-pressed]="settingsCategory === 'darstellung'" (click)="settingsCategory = 'darstellung'">Darstellung</button>
        <button type="button" class="settings-nav-btn" [class.active]="settingsCategory === 'konto'" [attr.aria-pressed]="settingsCategory === 'konto'" (click)="settingsCategory = 'konto'">Account</button>
      </div>

      <div class="settings-content">
        <app-account-settings *ngIf="settingsCategory === 'konto'"></app-account-settings>
        <div *ngIf="settingsCategory === 'darstellung'">
        <div class="settings-section">
          <span class="profile-label">Theme</span>
          <div class="chip-group">
            <button *ngFor="let t of themeOptions"
                    class="chip"
                    [class.active]="currentTheme === t.key"
                    (click)="currentTheme = t.key; settings.setTheme(t.key)">{{ t.label }}</button>
          </div>
        </div>

        <div class="settings-section">
          <span class="profile-label">Hintergrund</span>
          <div class="chip-group">
            <button *ngFor="let bg of backgroundOptions"
                    class="chip"
                    [class.active]="currentBackground === bg.key"
                    (click)="currentBackground = bg.key; settings.setBackground(bg.key)">{{ bg.label }}</button>
          </div>
        </div>
      </div>
    </div>

    </div>

    <div class="modal-actions">
      <div class="spacer"></div>
      <button class="nav-btn primary" (click)="close()">Schließen</button>
    </div>
  </div>
</div>
