<div class="portal-shell portal-home"
     [class.theme-light]="settings.theme === 'light'"
     [class.bg-aurora]="settings.backgroundKey === 'aurora'"
     [class.bg-sunset]="settings.backgroundKey === 'sunset'"
     [class.bg-forest]="settings.backgroundKey === 'forest'">
  <header class="portal-header">
    <h1>Schulportal</h1>
    <div class="header-actions">
      <button type="button" class="settings-btn" (click)="openSettings()" title="Einstellungen" aria-label="Einstellungen öffnen">⚙</button>
    </div>
  </header>

  <div class="tile-grid">
    <a *ngFor="let tile of tiles" class="tile" [attr.data-route]="tile.route" [routerLink]="tile.route">
      <div class="tile-top">
        <span class="tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" [ngSwitch]="tile.route">
            <g *ngSwitchCase="'/stundenplan'"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-13 4h2m4 0h2m-8 3h2"/></g>
            <g *ngSwitchCase="'/vertretungsplan'"><path d="M4 8h13l-3-3m6 11H7l3 3M20 8l-3 3M4 16l3-3"/><path d="M4 5v3m16 8v3"/></g>
            <g *ngSwitchCase="'/support'"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 0 1-1-5 9 9 0 0 1 18 0Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></g>
            <g *ngSwitchDefault><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m9 12 2 2 4-4"/></g>
          </svg>
        </span>
        <span class="tile-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m7 17 10-10M7 7h10v10"/></svg></span>
      </div>
      <div class="tile-title">{{ tile.title }}</div>
      <div class="tile-desc">{{ tile.description }}</div>
    </a>
  </div>

  <app-settings-modal [open]="settingsOpen" (openChange)="settingsOpen = $event"></app-settings-modal>
</div>
