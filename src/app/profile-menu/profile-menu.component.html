<button type="button" class="profile-trigger" (click)="open = true" aria-label="Accounteinstellungen öffnen">
  <span class="avatar" aria-hidden="true">{{ initials }}</span>
  <span class="name">{{ displayName }}</span>
</button>
<app-settings-modal *ngIf="open" [open]="open" initialCategory="konto" (openChange)="open = $event"></app-settings-modal>
