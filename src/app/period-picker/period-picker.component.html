<div class="period-picker" role="group" [attr.aria-label]="label"><label class="mode">{{label}}<select aria-label="Zeitauswahl" [ngModel]="custom?'custom':'lessons'" (ngModelChange)="mode($event)" [ngModelOptions]="{standalone:true}" [disabled]="disabled"><option value="lessons">Nach Unterrichtsstunden</option><option value="custom">Abweichende Uhrzeiten</option></select></label><div class="period-fields" *ngIf="!custom"><label>Ab Stunde<select aria-label="Ab Stunde" [ngModel]="first" (ngModelChange)="firstChanged($event)" [ngModelOptions]="{standalone:true}" [disabled]="disabled"><option *ngFor="let p of periods;let i=index" [ngValue]="i">{{i+1}}. Stunde · {{p.start}}–{{p.end}}</option></select></label><label>Bis Stunde<select aria-label="Bis Stunde" [ngModel]="last" (ngModelChange)="lastChanged($event)" [ngModelOptions]="{standalone:true}" [disabled]="disabled"><option *ngFor="let p of periods;let i=index" [ngValue]="i">{{i+1}}. Stunde · {{p.start}}–{{p.end}}</option></select></label></div><div class="period-fields" *ngIf="custom"><label>Von<input aria-label="Von" type="time" [ngModel]="start.slice(0,5)" (ngModelChange)="startChange.emit($event)" [ngModelOptions]="{standalone:true}" [disabled]="disabled" required></label><label>Bis<input aria-label="Bis" type="time" [ngModel]="end.slice(0,5)" (ngModelChange)="endChange.emit($event)" [ngModelOptions]="{standalone:true}" [disabled]="disabled" required></label></div><p aria-live="polite">{{custom?'Abweichende Uhrzeiten bleiben erhalten.':summary}} · {{start.slice(0,5)}}–{{end.slice(0,5)}} Uhr</p><p class="hint" *ngIf="!custom">Die Auswahl gilt einschließlich beider Stunden und der dazwischenliegenden Pausen.</p></div>
