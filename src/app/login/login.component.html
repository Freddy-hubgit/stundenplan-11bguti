<div class="login-shell">
  <div class="login-card">
    <h1>Schulportal</h1>
    <p class="subtitle">Anmelden</p>

    <form (ngSubmit)="submit()">
      <label class="field">
        <span>Name oder E-Mail</span>
        <input type="text" [(ngModel)]="identifier" name="identifier" required autocomplete="username" />
      </label>

      <label class="field">
        <span>Passwort</span>
        <div class="password-wrapper">
          <input [type]="passwordVisible ? 'text' : 'password'" [(ngModel)]="password" name="password" required autocomplete="current-password" />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" [attr.aria-label]="passwordVisible ? 'Passwort verstecken' : 'Passwort anzeigen'">
            {{ passwordVisible ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
      </label>

      <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="primary" [disabled]="loading">
        {{ loading ? 'Bitte warten ...' : 'Anmelden' }}
      </button>
    </form>
  </div>
</div>
