<div class="admin-shell">
  <header class="admin-header">
    <h1>Verwaltung</h1>
    <a routerLink="/" class="back-link">← Zurueck zum Portal</a>
  </header>

  <section class="panel">
    <h2>Neues Konto anlegen</h2>

    <form (ngSubmit)="createAccount()" class="create-form">
      <label class="field">
        <span>Name</span>
        <input type="text" [(ngModel)]="newName" name="newName" placeholder="z. B. Max Mustermann" />
      </label>

      <label class="field">
        <span>E-Mail</span>
        <input type="email" [(ngModel)]="newEmail" name="newEmail" required />
      </label>

      <label class="field">
        <span>Passwort</span>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="6" />
      </label>

      <label class="field">
        <span>Rolle</span>
        <select [(ngModel)]="newRole" name="newRole">
          <option value="user">Nutzer</option>
          <option value="support">Support</option>
          <option value="admin">Admin</option>
        </select>
      </label>

      <div class="message error" *ngIf="createError">{{ createError }}</div>
      <div class="message success" *ngIf="createSuccess">{{ createSuccess }}</div>

      <button type="submit" class="primary" [disabled]="creating">
        {{ creating ? 'Lege an ...' : 'Konto anlegen' }}
      </button>
    </form>
  </section>

  <section class="panel">
    <h2>Bestehende Konten</h2>

    <div *ngIf="loading">Lade ...</div>
    <div class="message error" *ngIf="loadError">{{ loadError }}</div>

    <table *ngIf="!loading && !loadError" class="profile-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>E-Mail</th>
          <th>Rolle</th>
          <th>Erstellt am</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngFor="let p of profiles">
          <tr>
            <td>{{ displayName(p) }}</td>
            <td>{{ p.email }}</td>
            <td><span class="role-badge" [class]="p.role">{{ p.role }}</span></td>
            <td>{{ p.created_at | date:'dd.MM.yyyy HH:mm' }}</td>
            <td>
              <button
                type="button"
                class="reset-btn"
                *ngIf="resetTargetId !== p.id"
                (click)="startReset(p)"
              >
                Passwort zuruecksetzen
              </button>
            </td>
          </tr>
          <tr *ngIf="resetTargetId === p.id">
            <td colspan="5">
              <div class="reset-row">
                <input
                  type="password"
                  [(ngModel)]="resetPasswordValue"
                  name="resetPassword-{{ p.id }}"
                  placeholder="Neues Passwort (min. 6 Zeichen)"
                />
                <div class="message error" *ngIf="resetError">{{ resetError }}</div>
                <div class="message success" *ngIf="resetSuccess">{{ resetSuccess }}</div>
                <div class="reset-actions">
                  <button type="button" class="primary" [disabled]="resetting" (click)="confirmReset(p)">
                    {{ resetting ? 'Setze zurueck ...' : 'Bestaetigen' }}
                  </button>
                  <button type="button" class="reset-btn" (click)="cancelReset()">Abbrechen</button>
                </div>
              </div>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </section>
</div>
